name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - 'src/**'
      - 'packaging/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/build-sidecar.ps1'
      - '.github/workflows/build-windows.yml'
      - 'scripts/test-windows-install.ps1'

concurrency:
  group: studyflow-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build full Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify clean install upgrade launch and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish-candidate:
    name: Publish verified 0.1.1-rc.7 pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StudyFlow-Windows-NSIS
          path: dist
      - name: Create candidate release only once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')
          if [ "$version" != "0.1.1-rc.7" ]; then
            echo "This one-time candidate publisher does not apply to version $version."
            exit 0
          fi
          if gh release view v0.1.1-rc.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Candidate already published; not replacing binaries."
            exit 0
          fi
          shopt -s nullglob
          installers=(dist/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one tested NSIS installer."
            exit 1
          fi
          gh release create v0.1.1-rc.7 "${installers[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "学序 StudyFlow 0.1.1-rc.7" \
            --prerelease --latest=false \
            --notes-file docs/RELEASE_CANDIDATE_0.1.1_RC7.md
