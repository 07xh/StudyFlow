name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pyproject.toml'
      - 'docs/RELEASE_CANDIDATE_*.md'
      - 'src/**'
      - 'packaging/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/build-sidecar.ps1'
      - '.github/workflows/build-windows.yml'
      - 'scripts/test-windows-install.ps1'

concurrency:
  group: studyflow-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-latest
    env:
      # Public HTTPS origin only; secret R2 keys are never embedded in the EXE.
      STUDYFLOW_R2_PUBLIC_BASE_URL: ${{ vars.STUDYFLOW_R2_PUBLIC_BASE_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build full Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify clean install upgrade launch and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  frontend-checks:
    name: React UI build and regression gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deterministic frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: TypeScript and production bundle
        run: npm --prefix frontend run build
      - name: React UI/IPC regression tests
        run: npm --prefix frontend test

  publish-candidate:
    name: Publish verified candidate pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows-package, frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StudyFlow-Windows-NSIS
          path: dist
      - name: Publish version-matched, verified candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Skipping non-RC version: $version."
            exit 0
          fi
          tag="v${version}"
          notes_file="docs/RELEASE_CANDIDATE_${version/-rc./_RC}.md"
          if [ ! -s "$notes_file" ]; then
            echo "Missing version-matched release notes: $notes_file"
            exit 1
          fi
          # Every manifest that embeds the candidate version must agree.
          python - <<'PY'
          import json
          from pathlib import Path
          import re
          version=json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"]
          assert json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))["version"] == version
          assert json.loads(Path("package.json").read_text(encoding="utf-8"))["version"] == version
          lock=json.loads(Path("frontend/package-lock.json").read_text(encoding="utf-8"))
          assert lock["version"] == version and lock["packages"][""]["version"] == version
          assert re.search(r'^version = "'+re.escape(version)+r'"$',Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"),re.M)
          print("Version manifests aligned:",version)
          PY
          # Avoid stale release artifacts from a superseded main build.
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$current_main" ] || [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Release aborted: this run does not match the latest main commit."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            published_sha=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            if [ "$published_sha" = "$GITHUB_SHA" ]; then
              echo "This commit has already been published as $tag; keeping existing binaries."
              exit 0
            fi
            echo "Release $tag already exists for $published_sha, refusing to overwrite."
            exit 1
          fi
          shopt -s nullglob
          installers=(dist/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one tested NSIS installer."
            exit 1
          fi
          gh release create "$tag" "${installers[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "学序 StudyFlow $version" \
            --prerelease --latest=false \
            --notes-file "$notes_file"

  mirror-candidate:
    name: Mirror published NSIS installer to Cloudflare R2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ACCOUNT_ID: ${{ secrets.STUDYFLOW_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.STUDYFLOW_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.STUDYFLOW_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.STUDYFLOW_R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.STUDYFLOW_R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StudyFlow-Windows-NSIS
          path: dist
      - name: Mirror only a GitHub-published version-matched installer
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_PUBLIC_BASE_URL" ]; then
            echo "R2 is not provisioned; GitHub Releases remains the only update source."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          version=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')
          tag="v${version}"
          shopt -s nullglob
          installers=(dist/*.exe)
          [ "${#installers[@]}" -eq 1 ] || { echo "Installer count mismatch"; exit 1; }
          asset="${installers[0]##*/}"
          release_target=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          [ "$release_target" = "$GITHUB_SHA" ] || { echo "Release commit mismatch"; exit 1; }
          release_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .digest")
          local_digest="sha256:$(sha256sum "${installers[0]}" | cut -d' ' -f1)"
          [ "$release_digest" = "$local_digest" ] || { echo "Release digest mismatch"; exit 1; }
          python -m pip install --disable-pip-version-check awscli
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            s3 cp "${installers[0]}" "s3://${R2_BUCKET}/releases/${tag}/${asset}" \
            --content-type application/octet-stream \
            --cache-control "public,max-age=31536000,immutable" --no-progress
          echo "Mirrored verified $tag / $asset"
