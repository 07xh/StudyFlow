name: StudyFlow validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: studyflow-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  frontend:
    name: React production build and UI/IPC tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build Tauri React frontend
        run: npm run build
      - name: Check course evidence and IPC boundary
        run: npm test
      - name: Install isolated browser smoke dependency
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Prepare browser for layout checks
        run: npx playwright install --with-deps chromium
      - name: Verify hierarchy at desktop and minimum-window widths
        run: node tests/browserHierarchy.cjs
      - name: Verify settings portal layout and keyboard interactions
        run: node tests/browserSettings.cjs
      - name: Upload empty-account UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-UI-Hierarchy-Captures
          path: frontend/test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  windows-package:
    name: Windows NSIS + bundled Zhidao runtime
    # The main-branch push has its own package workflow. Keep this full
    # installer check on PRs and manual runs without building it twice.
    if: github.event_name != 'push'
    # Match the main release workflow runner so installer regressions are caught before merge.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # scripts/build-windows.ps1 runs cargo test after building the sidecar
      # and generating Tauri icons; build.rs requires both prerequisites.
      - name: Build fully bundled Zhidao + StudyFlow Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload tested NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-standalone-Zhidao-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Verify clean install upgrade launch and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
