name: Python tests (manual / pull request)
on:
  workflow_dispatch:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
  tauri-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[desktop,dev]'
      - run: python -m PyInstaller --noconfirm --onefile --console --name studyflow-bridge --paths src --collect-all keyring --distpath packaging/sidecar --workpath build/pyinstaller --specpath build/specs packaging/bridge_entry.py
      - run: npm install --no-audit --no-fund
      - run: npm run tauri -- icon packaging/icon.svg
      - run: cargo check --manifest-path src-tauri/Cargo.toml
