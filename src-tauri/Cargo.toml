[package]
name = "studyflow"
version = "0.1.0"
description = "StudyFlow Windows desktop shell"
authors = ["StudyFlow contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "studyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
