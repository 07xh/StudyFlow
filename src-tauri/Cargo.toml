[package]
name = "studyflow"
version = "0.1.1-rc.21"
description = "StudyFlow Windows desktop shell"
authors = ["StudyFlow contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "studyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
