[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow"
version = "0.1.1rc66"
description = "学序 StudyFlow：知到、雨课堂、学习通与 U校园 Windows 学习客户端"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "python-dotenv>=1,<2", "beautifulsoup4>=4.12,<5", "cryptography>=42,<50"]

[project.optional-dependencies]
desktop = ["keyring>=25,<27", "websocket-client>=1.8,<2", "zhs==0.1.5"]
dev = ["pytest>=8", "pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
